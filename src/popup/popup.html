<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Reply idea</title>
        <style>
            :root { color-scheme: light dark; }
            body { margin: 0; padding: 8px; width: 356px; background: #fff; color: #0f1419;
                font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
            @media (prefers-color-scheme: dark) { body { background: #000; color: #e7e9ea; } }
            .paste { display: flex; flex-direction: column; gap: 8px; padding: 4px; }
            .paste h1 { margin: 0; font-size: 15px; }
            .paste p { margin: 0; color: #536471; font-size: 13px; }
            .paste textarea, .paste input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cfd9de;
                border-radius: 8px; background: transparent; color: inherit; font: inherit; }
            .paste textarea { min-height: 96px; resize: vertical; }
            .paste button { align-self: flex-end; height: 32px; padding: 0 16px; border: 0; border-radius: 999px;
                background: #0f1419; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
            @media (prefers-color-scheme: dark) {
                .paste p { color: #71767b; } .paste textarea, .paste input { border-color: #2f3336; }
                .paste button { background: #e7e9ea; color: #000; }
            }
            .paste textarea:focus, .paste input:focus { outline: none; border-color: #1d9bf0; box-shadow: 0 0 0 1px #1d9bf0; }
            .links { display: flex; justify-content: space-between; padding: 6px 4px 0; font-size: 12px; }
            .links a, .links button { color: #1d9bf0; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: none; }
            .xrg-panel { width: 100% !important; box-shadow: none !important; }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="popup.js"></script>
    </body>
</html>
