name: Release

# Push a tag like v0.2.0 (matching package.json) to publish a zip friends can install.
on:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - name: Check the tag matches package.json
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
                      exit 1
                  fi
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - name: Zip the extension
              run: cd dist && zip -r "../x-reply-generator-$GITHUB_REF_NAME.zip" .
            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" "x-reply-generator-$GITHUB_REF_NAME.zip" \
                      --title "X Reply Generator $GITHUB_REF_NAME" \
                      --notes "Download **x-reply-generator-$GITHUB_REF_NAME.zip** below, unzip it, and follow the install steps in the README."
